<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>实用工具</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
    <!-- 导航容器（由 common.js 注入） -->
    <div id="navbar-container"></div>

    <div class="container">
        <header>
            <div class="badge">🛠️ 实用工具合集</div>
            <h1>实用工具</h1>
            <p class="subtitle">收集各种便捷实用的小工具，提升效率</p>
        </header>

        <section id="tools">
            <h2>🧰 工具列表</h2>
            <div class="grid-3">
                <!-- 工具卡片1：域名查询 -->
                <div class="card feature-card">
                    <div class="icon-big">🔍</div>
                    <h3>域名信息查询</h3>
                    <p>查询域名 WHOIS 信息，包括到期时间、注册商等。</p>
                    <!-- 修改点：链接改为同目录下的 whois.html，并移除 target="_blank"（在同一窗口打开） -->
                    <a href="whois.html" class="btn btn-outline" style="margin-top: 1rem;">去使用</a>
                </div>

                <!-- 工具卡片2（示例） -->
                <div class="card feature-card">
                    <div class="icon-big">📝</div>
                    <h3>文本工具</h3>
                    <p>快速处理文本，如字数统计、格式转换等。</p>
                    <a href="#" class="btn btn-outline" style="margin-top: 1rem;">去使用</a>
                </div>

                <!-- 工具卡片3（示例） -->
                <div class="card feature-card">
                    <div class="icon-big">🔄</div>
                    <h3>数据转换</h3>
                    <p>JSON ↔ CSV、时间戳转换等常用数据工具。</p>
                    <a href="#" class="btn btn-outline" style="margin-top: 1rem;">去使用</a>
                </div>
            </div>
        </section>
    </div>

    <!-- 页脚容器 -->
    <div id="footer-container"></div>

    <script src="../js/common.js"></script>
</body>
</html>
