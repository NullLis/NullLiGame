<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>域名信息查询</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        .container { max-width: 880px; }
        .search-box { display: flex; gap: 0.8rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
        .search-box input { flex: 1; padding: 0.8rem 1.2rem; border: 2px solid #ddd; border-radius: 50px; font-size: 1rem; outline: none; background: rgba(255,255,255,0.7); min-width: 180px; }
        .search-box input:focus { border-color: var(--accent-dark); }
        .search-box select { padding: 0.7rem 1.2rem; border: 2px solid #ddd; border-radius: 50px; font-size: 1rem; background: rgba(255,255,255,0.7); outline: none; min-width: 100px; cursor: pointer; }
        .search-box select:focus { border-color: var(--accent-dark); }
        .search-box button { padding: 0.8rem 2rem; border: none; border-radius: 50px; background: var(--accent-dark); color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
        .search-box button:hover { background: #00695c; }

        /* 查询源选择区 */
        .source-selector {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(6px);
            border-radius: var(--radius);
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--card-border);
        }
        .source-selector .title {
            font-weight: 600;
            margin-right: 1rem;
            color: var(--text-muted);
            display: inline-block;
        }
        .source-selector .source-group {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 0.8rem 1.5rem;
            align-items: center;
        }
        .source-selector label {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text);
        }
        .source-selector label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent-dark);
            cursor: pointer;
        }
        .source-selector .actions {
            display: inline-flex;
            gap: 0.5rem;
            margin-left: 1rem;
        }
        .source-selector .actions button {
            background: none;
            border: 1px solid var(--accent-dark);
            border-radius: 20px;
            padding: 0.2rem 0.8rem;
            font-size: 0.8rem;
            color: var(--accent-dark);
            cursor: pointer;
            transition: background 0.2s;
        }
        .source-selector .actions button:hover {
            background: rgba(0,137,123,0.1);
        }
        @media (max-width: 600px) {
            .source-selector .source-group { display: flex; flex-direction: column; align-items: flex-start; gap: 0.3rem; }
            .source-selector .actions { margin-left: 0; margin-top: 0.5rem; }
            .search-box select { flex: 1; min-width: 80px; }
        }

        .loading { text-align: center; color: var(--text-muted); padding: 1rem; display: none; }
        .loading.active { display: block; }
        .error-msg { background: #ffebee; color: #c62828; padding: 0.8rem 1.2rem; border-radius: 12px; display: none; margin-bottom: 1rem; }
        .error-msg.active { display: block; }
        .result-table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.5); border-radius: var(--radius); overflow: hidden; display: none; }
        .result-table.active { display: table; }
        .result-table td { padding: 0.8rem 1.2rem; border-bottom: 1px solid rgba(0,0,0,0.06); }
        .result-table tr:last-child td { border-bottom: none; }
        .result-table .label { font-weight: 600; color: var(--text-muted); width: 30%; }
        .result-table .value { word-break: break-all; }
        .batch-hint { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.5rem; text-align: center; }
        .footer-note { margin-top: 2rem; text-align: center; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid rgba(0,0,0,0.06); padding-top: 1.5rem; }
        .manual-link { display: inline-block; margin-top: 0.5rem; color: var(--accent-dark); text-decoration: underline; cursor: pointer; }
        .manual-link:hover { color: #004d40; }
        header { margin-bottom: 1.5rem; }
        .raw-data-btn { margin-top: 1rem; background: none; border: 1px solid var(--accent-dark); border-radius: 20px; padding: 0.4rem 1.2rem; color: var(--accent-dark); cursor: pointer; font-size: 0.85rem; }
        .raw-data-btn:hover { background: rgba(0,137,123,0.1); }
        .raw-data-box { display: none; background: #2d3436; color: #dfe6e9; padding: 1rem; border-radius: var(--radius); overflow-x: auto; margin-top: 0.5rem; font-family: monospace; font-size: 0.85rem; max-height: 300px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
        .raw-data-box.active { display: block; }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container">
        <header>
            <div class="badge">🔍 域名查询工具</div>
            <h1>域名信息查询</h1>
            <p class="subtitle">输入域名主体（如 google）并选择后缀，或直接输入完整域名</p>
        </header>

        <div class="search-box">
            <input type="text" id="domainInput" placeholder="请输入域名主体，例如 google" />
            <select id="domainSuffix">
                <option value=".com">.com</option>
                <option value=".cn">.cn</option>
                <option value=".net">.net</option>
                <option value=".org">.org</option>
                <option value=".io">.io</option>
                <option value=".app">.app</option>
                <option value=".xyz">.xyz</option>
                <option value=".info">.info</option>
                <option value=".biz">.biz</option>
                <option value=".co">.co</option>
                <option value=".top">.top</option>
                <option value=".online">.online</option>
            </select>
            <button id="queryBtn">查询</button>
        </div>

        <!-- 查询源选择器 -->
        <div class="source-selector">
            <span class="title">🔌 查询源：</span>
            <div class="source-group" id="sourceGroup">
                <!-- 由 JS 动态生成 -->
            </div>
            <div class="actions">
                <button id="selectAllBtn">全选</button>
                <button id="deselectAllBtn">取消全选</button>
            </div>
        </div>

        <div class="loading" id="loading">⏳ 正在查询，请稍候...</div>
        <div class="error-msg" id="errorMsg">
            <span id="errorText"></span>
            <br>
            <a href="#" class="manual-link" id="manualWhois">👉 点击这里前往 whois.com 手动查询</a>
        </div>

        <div class="result-area">
            <table class="result-table" id="resultTable">
                <tr><td class="label">域名</td><td class="value" id="rDomain">-</td></tr>
                <tr><td class="label">注册商</td><td class="value" id="rRegistrar">-</td></tr>
                <tr><td class="label">注册日期</td><td class="value" id="rCreated">-</td></tr>
                <tr><td class="label">到期日期</td><td class="value" id="rExpiry">-</td></tr>
                <tr><td class="label">更新时间</td><td class="value" id="rUpdated">-</td></tr>
                <tr><td class="label">状态</td><td class="value" id="rStatus">-</td></tr>
                <tr><td class="label">WHOIS 服务器</td><td class="value" id="rWhois">-</td></tr>
            </table>
            <button class="raw-data-btn" id="rawToggle">📋 查看原始返回数据</button>
            <div class="raw-data-box" id="rawDataBox"></div>
        </div>

        <div class="batch-hint">💡 输入完整域名（含后缀）将自动忽略下拉框选项</div>
        <div class="footer-note">数据来源：免费 WHOIS API · 信息仅供参考</div>
    </div>

    <div id="footer-container"></div>

    <script src="../js/common.js"></script>
    <script>
        (function() {
            document.addEventListener('DOMContentLoaded', function() {
                // ===== 定义 API 源列表 =====
                const SOURCES = [
                    { id: 'vercel', name: 'Vercel WHOIS', url: 'https://whois-api.vercel.app/api/whois' },
                    { id: 'whoisvu', name: 'whois.vu', url: 'https://api.whois.vu/whois' }
                    // 可继续添加更多源，例如：
                    // { id: 'whoisws', name: 'whois.ws', url: 'https://whois.ws/whois' }
                ];

                // DOM 元素
                const input = document.getElementById('domainInput');
                const suffixSelect = document.getElementById('domainSuffix');
                const btn = document.getElementById('queryBtn');
                const loading = document.getElementById('loading');
                const errorMsg = document.getElementById('errorMsg');
                const errorText = document.getElementById('errorText');
                const manualLink = document.getElementById('manualWhois');
                const table = document.getElementById('resultTable');
                const rawToggle = document.getElementById('rawToggle');
                const rawBox = document.getElementById('rawDataBox');
                const sourceGroup = document.getElementById('sourceGroup');
                const selectAllBtn = document.getElementById('selectAllBtn');
                const deselectAllBtn = document.getElementById('deselectAllBtn');

                const rDomain = document.getElementById('rDomain');
                const rRegistrar = document.getElementById('rRegistrar');
                const rCreated = document.getElementById('rCreated');
                const rExpiry = document.getElementById('rExpiry');
                const rUpdated = document.getElementById('rUpdated');
                const rStatus = document.getElementById('rStatus');
                const rWhois = document.getElementById('rWhois');

                // ===== 渲染源复选框 =====
                function renderSourceCheckboxes() {
                    let html = '';
                    SOURCES.forEach((src, index) => {
                        html += `
                            <label>
                                <input type="checkbox" value="${src.id}" data-url="${src.url}" ${index === 0 ? 'checked' : ''} />
                                ${src.name}
                            </label>
                        `;
                    });
                    sourceGroup.innerHTML = html;
                }
                renderSourceCheckboxes();

                // ===== 全选 / 取消全选 =====
                selectAllBtn.addEventListener('click', function() {
                    const checkboxes = sourceGroup.querySelectorAll('input[type="checkbox"]');
                    checkboxes.forEach(cb => cb.checked = true);
                });
                deselectAllBtn.addEventListener('click', function() {
                    const checkboxes = sourceGroup.querySelectorAll('input[type="checkbox"]');
                    checkboxes.forEach(cb => cb.checked = false);
                });

                // ===== 获取选中的源 URL 列表（按页面顺序） =====
                function getSelectedSources() {
                    const checkboxes = sourceGroup.querySelectorAll('input[type="checkbox"]');
                    const selected = [];
                    checkboxes.forEach(cb => {
                        if (cb.checked) {
                            selected.push(cb.dataset.url);
                        }
                    });
                    return selected;
                }

                // ===== 核心查询函数 =====
                let lastRawData = null;

                async function queryWhois(domain) {
                    let raw = domain.trim().toLowerCase();
                    let fullDomain;
                    if (raw.includes('.')) {
                        fullDomain = raw;
                    } else {
                        fullDomain = raw + suffixSelect.value;
                    }
                    fullDomain = fullDomain.replace(/^https?:\/\//, '').replace(/^www\./, '');
                    if (!fullDomain || fullDomain === '.') {
                        showError('请输入有效的域名');
                        return;
                    }

                    const selectedUrls = getSelectedSources();
                    if (selectedUrls.length === 0) {
                        showError('请至少选择一个查询源');
                        return;
                    }

                    loading.classList.add('active');
                    table.classList.remove('active');
                    rawBox.classList.remove('active');
                    rawBox.textContent = '';
                    errorMsg.classList.remove('active');

                    let lastError = null;
                    for (const url of selectedUrls) {
                        try {
                            const apiUrl = `${url}?domain=${encodeURIComponent(fullDomain)}`;
                            const controller = new AbortController();
                            const timeoutId = setTimeout(() => controller.abort(), 15000);
                            const response = await fetch(apiUrl, { signal: controller.signal });
                            clearTimeout(timeoutId);

                            if (!response.ok) throw new Error(`HTTP ${response.status}`);
                            const data = await response.json();
                            if (data.error || data.status === 'error') {
                                throw new Error(data.error || data.message || '查询失败');
                            }
                            // 保存原始数据
                            lastRawData = data;
                            // 提取信息
                            const whoisData = data.whois || data;
                            const domainName = whoisData.domain_name || whoisData.domain || fullDomain;
                            const registrar = whoisData.registrar || whoisData.registrar_name || whoisData.registrant || '-';
                            const creationDate = whoisData.creation_date || whoisData.created || whoisData.registration_date || '-';
                            const expiryDate = whoisData.expiration_date || whoisData.expiry || whoisData.registrar_registration_expiration_date || '-';
                            const updatedDate = whoisData.updated_date || whoisData.updated || whoisData.changed || '-';
                            const status = Array.isArray(whoisData.status) ? whoisData.status.join(', ') : (whoisData.status || whoisData.domain_status || '-');
                            const whoisServer = whoisData.whois_server || whoisData.whois || '-';

                            rDomain.textContent = domainName;
                            rRegistrar.textContent = registrar;
                            rCreated.textContent = formatDate(creationDate);
                            rExpiry.textContent = formatDate(expiryDate);
                            rUpdated.textContent = formatDate(updatedDate);
                            rStatus.textContent = status;
                            rWhois.textContent = whoisServer;

                            table.classList.add('active');
                            loading.classList.remove('active');
                            return; // 成功，退出
                        } catch (err) {
                            lastError = err;
                            continue; // 尝试下一个源
                        }
                    }

                    // 所有选中的源均失败
                    loading.classList.remove('active');
                    const msg = lastError ? lastError.message : '未知错误';
                    showError(`所有选中源均查询失败：${msg}，请稍后重试或手动查询。`);
                    manualLink.href = `https://www.whois.com/whois/${encodeURIComponent(fullDomain)}`;
                    manualLink.style.display = 'inline-block';
                }

                function formatDate(value) {
                    if (!value || value === '-') return '-';
                    let date = new Date(value);
                    if (isNaN(date.getTime())) {
                        const parts = value.split(/[-\s/]+/);
                        if (parts.length === 3) {
                            const months = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
                            if (months[parts[1].toLowerCase()] !== undefined) {
                                date = new Date(parseInt(parts[2]), months[parts[1].toLowerCase()], parseInt(parts[0]));
                            } else {
                                date = new Date(value);
                            }
                        } else {
                            date = new Date(value);
                        }
                    }
                    if (isNaN(date.getTime())) return value;
                    return date.toLocaleDateString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit' });
                }

                function showError(msg) {
                    errorText.textContent = msg;
                    errorMsg.classList.add('active');
                }

                // ===== 事件绑定 =====
                btn.addEventListener('click', () => queryWhois(input.value));
                input.addEventListener('keydown', (e) => { if (e.key === 'Enter') btn.click(); });

                manualLink.style.display = 'none';

                // 显示原始数据
                rawToggle.addEventListener('click', function() {
                    if (rawBox.classList.contains('active')) {
                        rawBox.classList.remove('active');
                        return;
                    }
                    if (lastRawData) {
                        rawBox.textContent = JSON.stringify(lastRawData, null, 2);
                        rawBox.classList.add('active');
                    } else {
                        rawBox.textContent = '暂无数据，请先查询一个域名。';
                        rawBox.classList.add('active');
                    }
                });
            });
        })();
    </script>
</body>
</html>
