<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>联系我们 — 项目集</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
    <nav class="navbar">
        <a href="../index.html" class="nav-logo">🧩 项目集</a>
        <button class="nav-toggle" id="navToggle">☰</button>
        <ul class="nav-links" id="navLinks">
            <li><a href="../index.html">首页</a></li>
            <li><a href="contact.html" class="active">联系我们</a></li>
        </ul>
    </nav>

    <div class="container">
        <header>
            <div class="badge">📬 保持联络</div>
            <h1>联系我们</h1>
            <p class="subtitle">有建议、合作或问题？欢迎通过以下方式找到我们</p>
        </header>

        <div class="contact-grid" id="contactGrid"></div>

        <!-- 二维码展示区域（如果 contact.json 中有 qrcode 字段才会显示） -->
        <div class="qrcode-container" id="qrcodeContainer" style="display: none;">
            <div class="contact-card qrcode-card">
                <h3>扫一扫添加我们</h3>
                <img id="qrcodeImage" src="" alt="二维码" class="qrcode-image" />
                <p style="color: var(--text-muted); font-size: 0.9rem;">点击图片可放大查看</p>
            </div>
        </div>

        <p style="text-align: center; color: var(--text-muted);">
            通常 7*24 小时内回复，感谢支持！
        </p>
    </div>

    <div class="footer">
        <div class="footer-links">
            <a href="#">服务条款</a>
            <a href="#">隐私政策</a>
        </div>
        Built with ❤️ &nbsp;|&nbsp; © 2026 Nulllis
    </div>

    <!-- 图片放大覆盖层 -->
    <div id="imageOverlay" class="image-overlay" style="display: none;">
        <img src="" alt="放大图片" id="overlayImage" />
        <button class="overlay-close" id="overlayClose">✕</button>
    </div>

    <script src="../js/common.js"></script>
</body>
</html>
