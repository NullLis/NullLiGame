<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>联系我们</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container">
        <header>
            <div class="badge">📬 联系我们</div>
            <h1>联系我们</h1>
            <p class="subtitle">有任何问题或建议，欢迎随时与我们取得联系</p>
        </header>

        <section id="contact">
            <h2>📋 联系方式</h2>
            <div class="grid-3" id="contactGrid"></div>
        </section>

        <section id="gallery">
            <h2>🖼️ 图片展示</h2>
            <div id="imageGallery" style="display: none; flex-wrap: wrap; gap: 1rem; justify-content: center;"></div>
        </section>

        <!-- 图片放大遮罩层 -->
        <div id="imageOverlay" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 9999;">
            <button id="overlayClose" style="position: absolute; top: 20px; right: 30px; font-size: 2rem; background: none; border: none; color: white; cursor: pointer;">&times;</button>
            <img id="overlayImage" src="" alt="放大预览" style="max-width: 90%; max-height: 90%; object-fit: contain;" />
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="../js/common.js"></script>
</body>
</html>
